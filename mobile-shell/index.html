<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#060915" />
    <title>Northstar</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #060915;
        color: #f8fafc;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, #172554 0, transparent 45%),
          #060915;
      }

      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin-bottom: 0.5rem;
        font-size: 2rem;
      }

      p {
        color: #a5b4fc;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Northstar</h1>
      <p>Connect to the internet to sync your goals and continue your journey.</p>
    </main>
  </body>
</html>
